# Buckle upstream pool: group name == wire id (the model string clients put
# in the request body). Loopback-only by committed default; cloud tiers are
# DORMANT — they appear in the ladder but resolve to zero deployments until
# an operator supplies them at runtime via BUCKLE_UPSTREAMS (a second YAML
# merged over this one; keys come from env vars named in api_key_env, never
# from committed files).
#
# Fields: url (upstream base), dialect ("openai" | "anthropic"), optional
# model (upstream's real model id when the group alias differs — the request
# body's model field is patched; absent = forward verbatim), optional
# api_key_env (env var name holding the bearer key).
version: 1

groups:
  glm-5.3-flash:
    - url: http://127.0.0.1:8902
      dialect: openai
      adapter: openai-compat # W134 §4.2: per-deployment family; absent = derived from dialect
  local-swarm:
    - url: http://127.0.0.1:8902
      dialect: openai
      adapter: openai-compat
    - url: http://127.0.0.1:8901
      dialect: openai
      adapter: openai-compat
    - url: http://127.0.0.1:8903
      dialect: openai
      adapter: openai-compat
    - url: http://127.0.0.1:8906
      dialect: openai
      adapter: openai-compat
  gpt-5.2: [] # dormant — activation is a BUCKLE_UPSTREAMS override, never a committed key
  # W206 (owner decision 2026-10-02, option a): committed anthropic-dialect
  # deployments for the Claude Code model ids. Dormant until ANTHROPIC_API_KEY
  # exists at runtime (same env-gated law as every cloud row: keys live in
  # env vars named in api_key_env, never in committed files). The adapter
  # family is W134 tier 1 — same-dialect pass-through, no translation.
  claude-sonnet-5:
    - url: https://api.anthropic.com
      dialect: anthropic
      adapter: anthropic
      api_key_env: ANTHROPIC_API_KEY
  claude-fable-5-1:
    - url: https://api.anthropic.com
      dialect: anthropic
      adapter: anthropic
      api_key_env: ANTHROPIC_API_KEY
  claude-opus-5-5:
    - url: https://api.anthropic.com
      dialect: anthropic
      adapter: anthropic
      api_key_env: ANTHROPIC_API_KEY
  claude-haiku-4-5:
    - url: https://api.anthropic.com
      dialect: anthropic
      adapter: anthropic
      api_key_env: ANTHROPIC_API_KEY

