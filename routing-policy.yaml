# Buckle's copy of the fleet routing policy — the SAME file belt loads
# (bin/routing-policy.yaml); one file an SRE recognizes. Resolution order:
# BUCKLE_POLICY env (or BELT_POLICY) → runtime copy in the local-llm dir →
# this committed default. Operators edit the YAML, never code.
#
# Native-router semantics ported from LiteLLM 1.103.0 (MIT; pinned-source
# verified in W126/W129): fallbacks = ordered cross-group ladders tried after
# num_retries per tier; allowed_fails + cooldown_time = passive outlier
# ejection; num_retries = per-tier retries whose backoff honors the upstream
# retry-after header with jitter (utils.py::_calculate_retry_after).
#
# OWNER DIRECTIVES 2026-10-01 (lesson.fanout-rate-budget):
#   - ladder: glm-5.3-flash → local-swarm → gpt-5.2 → claude-sonnet-5.
#     NEVER flashx — same upstream family saturates together, and flashx is
#     too expensive. Buckle refuses flashx tiers defensively even if an edit
#     adds one.
version: 1

gateway:
  num_retries: 1
  allowed_fails: 3
  cooldown_time: 30
  fallbacks:
    glm-5.3-flash: [local-swarm, gpt-5.2, claude-sonnet-5]

# W136 §3.2 capability tags — the string hint tag regexps match against
# (capability_text = tags + wire id). The fix for a must-miss is data, not
# code: add the tag here (or to a good_at string), never a synonym at route
# time. Honest 503 when no group carries the hinted tag — W136 §7.5.
tags:
  glm-5.3-flash: [fast, cheap, menial, general]
  local-swarm: [local, general, fast, cheap, code, extract, reasoning]
  gpt-5.2: [frontier, reasoning, code]
  claude-sonnet-5: [frontier, reasoning, code, long-context]

# W142 knowledge aids — buckle enforcement knobs (belt ignores this block;
# the aids stanza a lane brief declares is gated here). preseed is
# allowlist-per-domain: add a domain below to switch it on (default: on
# allows all). compress stays DEFAULT-OFF per the W137 economics — cached
# reads are 0.1x, so compression must prove ROI on cache-miss traffic
# before an operator flips it. cache-align is pure layout, default on.
aids:
  preseed:
    default: off
    domains: []
    ttl_s: 300
  cache-align:
    default: on
  compress:
    default: off
    max_prose_bytes: 1536
  # W4 intent expansion (the W288 retarget): orchestrate-enhance declares
  # `expand` and the user goal is expanded with an architectural-wants
  # digest (fleet laws + repo conventions) by the LOCAL DIRECT tier — one
  # candidate, no ladder walk, never a cloud row. DEFAULT-OFF until an
  # operator flips it (an extra LLM hop must prove ROI first).
  expand:
    default: off
    group: local-swarm
    timeout_ms: 3000
    max_goal_chars: 4000
    max_digest_bytes: 2048
